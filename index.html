<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily English Studio 每日英語朗讀練習室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap');
    
    :root {
      --app-font: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
      --sentence-scale: 1.25rem;
      --word-scale: 1.45rem;
      --detail-scale: 1.12rem;
      --detail-sub-scale: 1.02rem;
    }
    
    body {
      font-family: var(--app-font);
    }
    
    .font-mono-ipa {
      font-family: 'JetBrains Mono', monospace;
    }

    .font-size-large {
      --sentence-scale: 1.45rem;
      --word-scale: 1.65rem;
      --detail-scale: 1.28rem;
      --detail-sub-scale: 1.16rem;
    }
    
    .font-size-xlarge {
      --sentence-scale: 1.65rem;
      --word-scale: 1.88rem;
      --detail-scale: 1.44rem;
      --detail-sub-scale: 1.30rem;
    }

    .chinese-main-meaning {
      font-size: var(--detail-scale) !important;
      line-height: 1.6 !important;
    }

    .chinese-detail-text {
      font-size: var(--detail-sub-scale) !important;
      line-height: 1.75 !important;
    }

    .sentence-text {
      font-size: var(--sentence-scale) !important;
      line-height: 1.55 !important;
    }
    
    .word-title {
      font-size: var(--word-scale) !important;
    }
    
    .word-sentence {
      font-size: var(--sentence-scale) !important;
      line-height: 1.55 !important;
    }

    .card-active-playing {
      border-color: #3b82f6 !important;
      background: linear-gradient(to bottom right, #ffffff, #eff6ff) !important;
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.25), 0 8px 10px -6px rgba(59, 130, 246, 0.15) !important;
      transform: translateY(-2px);
    }

    @keyframes soundwave {
      0%, 100% { height: 4px; }
      50% { height: 16px; }
    }
    .wave-bar-1 { animation: soundwave 1s ease-in-out infinite; }
    .wave-bar-2 { animation: soundwave 1.2s ease-in-out infinite 0.2s; }
    .wave-bar-3 { animation: soundwave 0.8s ease-in-out infinite 0.4s; }
    .wave-bar-4 { animation: soundwave 1.1s ease-in-out infinite 0.1s; }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen selection:bg-blue-100 selection:text-blue-900 pb-20">

  <!-- Ambient Light Decoration -->
  <div class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-blue-400/10 rounded-full blur-3xl"></div>
    <div class="absolute top-80 -left-40 w-96 h-96 bg-indigo-400/10 rounded-full blur-3xl"></div>
  </div>

  <!-- Header -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-5xl mx-auto px-4 py-3 sm:px-6 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
      
      <!-- Brand & Status -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-sky-500 flex items-center justify-center shadow-md shadow-blue-500/20 text-white shrink-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/></svg>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-base sm:text-lg font-extrabold text-slate-900 tracking-tight">
                Daily English Studio
              </h1>
              <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-50 text-blue-700 border border-blue-200">
                PRO 旗艦版
              </span>
            </div>
            <div class="flex items-center gap-2 text-xs text-slate-500">
              <span id="firestoreStatus" class="inline-flex items-center gap-1 font-medium">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                雲端連線就緒
              </span>
            </div>
          </div>
        </div>

        <!-- Mobile Login Button -->
        <div class="md:hidden">
          <button id="mobileLoginBtn" class="p-2 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200" title="登入管理員">
            <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          </button>
        </div>
      </div>

      <!-- Controls Toolbar -->
      <div class="flex flex-wrap items-center gap-2">
        <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-2xl border border-slate-200">
          
          <!-- Voice Selector -->
          <div class="flex items-center gap-1 pl-1">
            <span class="text-[11px] text-slate-500 font-semibold hidden sm:inline">🎙️</span>
            <select id="voiceSelect" class="bg-white border border-slate-200 rounded-xl px-2 py-1 text-slate-700 font-semibold text-xs focus:ring-2 focus:ring-blue-500 outline-none max-w-[130px] sm:max-w-[170px] truncate shadow-xs">
              <option value="auto">✨ 推薦高音質發音</option>
            </select>
          </div>

          <!-- Speed Selector -->
          <div class="flex items-center gap-1 pl-1">
            <span class="text-[11px] text-slate-500 font-semibold hidden sm:inline">⚡</span>
            <select id="speedSelect" class="bg-white border border-slate-200 rounded-xl px-2 py-1 text-slate-700 font-semibold text-xs focus:ring-2 focus:ring-blue-500 outline-none shadow-xs">
              <option value="0.8">0.8x 慢</option>
              <option value="1.0" selected>1.0x 標</option>
              <option value="1.2">1.2x 快</option>
            </select>
          </div>

          <!-- Font Size Selector -->
          <div class="flex items-center gap-1 pl-1 pr-1">
            <span class="text-[11px] text-slate-500 font-semibold hidden sm:inline">🔍</span>
            <select id="fontSizeSelect" class="bg-white border border-slate-200 rounded-xl px-2 py-1 text-slate-700 font-semibold text-xs focus:ring-2 focus:ring-blue-500 outline-none shadow-xs">
              <option value="normal" selected>標準 A</option>
              <option value="large">大字 A+</option>
              <option value="xlarge">特大 A++</option>
            </select>
          </div>

          <!-- Stop Playing -->
          <button id="stopAllBtn" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-2.5 py-1 rounded-xl text-xs font-bold transition-all flex items-center gap-1 active:scale-95 shadow-xs" title="停止目前播放">
            <span class="w-2 h-2 rounded-full bg-red-500"></span>
            <span>停止</span>
          </button>
        </div>

        <!-- Google Admin Auth (Desktop) -->
        <div id="authContainer" class="hidden md:flex items-center gap-2">
          <button id="loginBtn" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 px-3.5 py-1.5 rounded-xl text-xs font-bold shadow-xs transition-all flex items-center gap-2 active:scale-95">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            管理員登入
          </button>
          <div id="userProfileArea" class="hidden flex items-center gap-2 bg-emerald-50 border border-emerald-300 px-3 py-1.5 rounded-xl text-xs text-emerald-800 shadow-xs font-semibold">
            <span class="w-2 h-2 rounded-full bg-emerald-500 ring-2 ring-emerald-200"></span>
            <span id="userEmailSpan" class="truncate max-w-[130px]"></span>
            <button id="logoutBtn" class="text-xs text-slate-500 hover:text-red-600 underline ml-1">登出</button>
          </div>
        </div>

      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 pt-6">
    
    <!-- Date Bar & Controls -->
    <div class="bg-white rounded-2xl border border-slate-200 p-4 mb-6 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div class="flex flex-wrap items-center gap-2.5 flex-1">
        <button id="openCalendarBtn" class="bg-gradient-to-r from-blue-50 to-indigo-50 hover:from-blue-100 hover:to-indigo-100 text-blue-800 border border-blue-200 px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all flex items-center gap-2.5 shadow-xs active:scale-95 group">
          <svg class="w-4 h-4 text-blue-600 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <span id="calendarCurrentDateLabel">📅 2026-11-08 (今日教材)</span>
          <span class="text-[11px] bg-blue-600 text-white px-2 py-0.5 rounded-full font-bold">日曆選單</span>
        </button>

        <select id="lessonDateSelect" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs sm:text-sm font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
          <option value="2026-11-08">2026-11-08 (今日教材)</option>
        </select>
      </div>

      <div id="adminControlsArea" class="flex flex-wrap items-center gap-2 shrink-0">
        <button id="seedDataBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 shadow-sm active:scale-95" title="以管理員身分將今日教材寫入 Firestore">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
          <span id="seedBtnLabel">同步今日教材至雲端</span>
        </button>
        <button id="openImportModalBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 active:scale-95" title="補登或批次上傳多日教材">
          <svg class="w-3.5 h-3.5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
          批次補登／新增
        </button>
      </div>
    </div>

    <!-- Notification Toast -->
    <div id="statusToast" class="hidden mb-5 p-3.5 rounded-2xl text-xs font-semibold flex items-center justify-between border shadow-sm transition-all">
      <div class="flex items-center gap-2">
        <span id="toastIcon">✨</span>
        <span id="statusToastMsg"></span>
      </div>
      <button id="closeToastBtn" class="p-1 rounded-lg text-slate-500 hover:bg-black/5">✕</button>
    </div>

    <!-- Shadowing Audio Deck -->
    <section class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 rounded-3xl p-6 sm:p-7 text-white shadow-xl shadow-indigo-950/20 mb-8 border border-white/10 relative overflow-hidden">
      <div class="absolute -top-24 -right-24 w-60 h-60 bg-blue-500/20 rounded-full blur-2xl pointer-events-none"></div>
      
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-6 relative z-10">
        <div class="space-y-2 max-w-xl">
          <div class="flex items-center gap-2.5">
            <span class="bg-blue-500/20 border border-blue-400/30 text-blue-200 text-xs px-2.5 py-0.5 rounded-full font-bold uppercase tracking-wider flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-ping"></span>
              Shadowing 跟讀沉浸模式
            </span>
            <span id="playingStatusBadge" class="text-xs text-slate-400 font-medium">準備就緒</span>
          </div>
          <h2 class="text-xl sm:text-2xl font-black tracking-tight text-white flex items-center gap-2">
            一鍵連續全自動跟讀播放
          </h2>
          <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">
            系統依序播放每句例句，並在每句之間預留開口停頓時間，強化聽力直覺與口語發音。
          </p>
        </div>

        <div class="flex flex-wrap sm:flex-nowrap items-center gap-3 shrink-0">
          <button id="playAllSentencesBtn" class="w-full sm:w-auto bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-bold px-5 py-3 rounded-2xl shadow-lg shadow-blue-500/25 text-sm transition-all flex items-center justify-center gap-2.5 active:scale-95 group">
            <div class="w-6 h-6 rounded-full bg-white/20 flex items-center justify-center group-hover:scale-110 transition-transform">
              <svg class="w-3.5 h-3.5 fill-current ml-0.5" viewBox="0 0 20 20"><path d="M4.5 3.5v13l11-6.5-11-6.5z"/></svg>
            </div>
            <span>連續朗讀 10 句會話</span>
          </button>
          
          <button id="playAllWordsBtn" class="w-full sm:w-auto bg-white/10 hover:bg-white/15 text-white border border-white/20 font-bold px-5 py-3 rounded-2xl text-sm transition-all flex items-center justify-center gap-2.5 active:scale-95">
            <div class="w-6 h-6 rounded-full bg-white/10 flex items-center justify-center">
              <svg class="w-3.5 h-3.5 fill-current ml-0.5" viewBox="0 0 20 20"><path d="M4.5 3.5v13l11-6.5-11-6.5z"/></svg>
            </div>
            <span>連續朗讀 10 個單字</span>
          </button>
        </div>
      </div>

      <div id="nowPlayingDisplay" class="mt-5 pt-4 border-t border-white/10 hidden space-y-3">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div class="flex items-center gap-3">
            <div class="flex items-end gap-1 h-5 px-1 shrink-0">
              <span class="w-1 bg-blue-400 rounded-full wave-bar-1"></span>
              <span class="w-1 bg-blue-300 rounded-full wave-bar-2"></span>
              <span class="w-1 bg-indigo-400 rounded-full wave-bar-3"></span>
              <span class="w-1 bg-sky-300 rounded-full wave-bar-4"></span>
            </div>
            <div>
              <p class="text-[11px] text-blue-300 font-semibold uppercase tracking-wider flex items-center gap-2">
                <span>正在播放中</span>
                <span id="playingItemProgressTag" class="px-2 py-0.2 rounded-full bg-blue-500/30 text-white font-mono text-[10px]">1 / 10</span>
              </p>
              <p id="nowPlayingText" class="text-sm sm:text-base font-bold text-white tracking-wide truncate max-w-md sm:max-w-xl"></p>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span id="shadowingCountdownBadge" class="text-xs text-blue-200 font-bold bg-white/10 px-2.5 py-1 rounded-lg border border-white/20">🗣️ 跟讀間隔</span>
          </div>
        </div>

        <div class="w-full bg-white/10 rounded-full h-1.5 overflow-hidden">
          <div id="autoPlayProgressBar" class="bg-gradient-to-r from-blue-400 to-indigo-400 h-1.5 rounded-full transition-all duration-300" style="width: 10%;"></div>
        </div>
      </div>
    </section>

    <!-- Main Learning Tabs & Secondary Controls -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 border-b border-slate-200 pb-3 mb-6">
      
      <!-- Primary Tabs Pill (Sentences vs Words) -->
      <div class="flex items-center bg-slate-100 p-1.5 rounded-2xl border border-slate-200/80 shadow-inner">
        <button id="tabSentencesBtn" type="button" class="px-5 py-2 rounded-xl font-extrabold text-xs sm:text-sm bg-white text-blue-700 shadow-sm transition-all flex items-center gap-2 cursor-pointer">
          <span>💬</span>
          <span>10 句常用會話句型</span>
        </button>
        <button id="tabWordsBtn" type="button" class="px-5 py-2 rounded-xl font-bold text-xs sm:text-sm text-slate-600 hover:text-slate-900 transition-all flex items-center gap-2 cursor-pointer">
          <span>📖</span>
          <span>10 個核心實用單字</span>
        </button>
      </div>

      <!-- Quick Self-Test Toggle & Export Dropdown (No overflow clipping!) -->
      <div class="flex flex-wrap items-center gap-2 relative z-20">
        <button id="toggleExplanationBtn" type="button" class="text-xs text-slate-700 hover:text-blue-700 font-bold flex items-center gap-2 px-3.5 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 transition-all shadow-xs active:scale-95 cursor-pointer">
          <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          <span id="toggleExpText">隱藏中文解說（自我測驗）</span>
        </button>

        <!-- Unclipped Export Dropdown Menu -->
        <div class="relative" id="exportDropdownContainer">
          <button id="exportDropdownBtn" type="button" class="px-4 py-2 rounded-xl text-xs font-extrabold bg-slate-900 text-white hover:bg-blue-700 transition-all flex items-center gap-1.5 shadow-sm active:scale-95 cursor-pointer">
            <span>📥 匯出教材 (Word / PDF)</span>
            <svg class="w-3.5 h-3.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div id="exportMenu" class="hidden absolute right-0 mt-2 w-60 bg-white rounded-2xl shadow-2xl border border-slate-200 py-2 z-50 ring-1 ring-black/5">
            <div class="px-3 py-1.5 text-[11px] font-bold text-slate-400 border-b border-slate-100">選擇匯出檔案格式</div>
            <button id="downloadWordBtn" type="button" class="w-full text-left px-4 py-2.5 text-xs font-bold text-slate-700 hover:bg-blue-50 hover:text-blue-700 flex items-center gap-2.5 transition-colors cursor-pointer">
              <span class="text-base">📄</span>
              <div>
                <div>下載 Word 講義 (.doc)</div>
                <div class="text-[10px] font-normal text-slate-400">可用 Word / Google 文件編輯</div>
              </div>
            </button>
            <button id="printHandoutBtn" type="button" class="w-full text-left px-4 py-2.5 text-xs font-bold text-slate-700 hover:bg-blue-50 hover:text-blue-700 flex items-center gap-2.5 transition-colors cursor-pointer">
              <span class="text-base">📑</span>
              <div>
                <div>列印 / 另存 PDF 講義</div>
                <div class="text-[10px] font-normal text-slate-400">A4 雙單元高對比排版</div>
              </div>
            </button>
            <button id="copyMarkdownBtn" type="button" class="w-full text-left px-4 py-2.5 text-xs font-bold text-slate-700 hover:bg-blue-50 hover:text-blue-700 flex items-center gap-2.5 transition-colors cursor-pointer">

    // -------------------------------------------------------------
    const speedSelect = document.getElementById('speedSelect');
    const voiceSelect = document.getElementById('voiceSelect');
    const stopAllBtn = document.getElementById('stopAllBtn');
    const playingStatusBadge = document.getElementById('playingStatusBadge');
    const nowPlayingDisplay = document.getElementById('nowPlayingDisplay');
    const nowPlayingText = document.getElementById('nowPlayingText');

    let availableVoices = [];
    let autoPlayTimer = null;
    let isAutoPlaying = false;
    let autoPlayIndex = 0;
    let autoPlayItems = [];

    function populateVoices() {
      if (!('speechSynthesis' in window)) return;
      const allVoices = window.speechSynthesis.getVoices();
      const englishVoices = allVoices.filter(v => v.lang.startsWith('en') || v.lang.includes('US') || v.lang.includes('GB'));
      
      englishVoices.sort((a, b) => {
        const score = v => {
          let s = 0;
          const name = v.name.toLowerCase();
          if (name.includes('natural') || name.includes('online')) s += 10;
          if (name.includes('google')) s += 8;
          if (name.includes('premium') || name.includes('enhanced')) s += 7;
          if (name.includes('samantha') || name.includes('daniel') || name.includes('jenny') || name.includes('guy')) s += 6;
          if (v.lang === 'en-US') s += 2;
          return s;
        };
        return score(b) - score(a);
      });

      availableVoices = englishVoices;
      if (voiceSelect) {
        voiceSelect.innerHTML = '<option value="auto">✨ 推薦高音質發音</option>';
        let savedVoice = null;
        try {
          savedVoice = localStorage.getItem('daily_english_voice');
        } catch (e) {}

        englishVoices.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v.name;
          
          let label = v.name;
          if (v.name.includes('Google US')) label = '🇺🇸 Google 美音 (流暢)';
          else if (v.name.includes('Google UK')) label = '🇬🇧 Google 英音 (標準)';
          else if (v.name.includes('Jenny')) label = '🇺🇸 微軟 Jenny (真人級)';
          else if (v.name.includes('Guy')) label = '🇺🇸 微軟 Guy (自然美音)';
          else if (v.name.includes('Samantha')) label = '🇺🇸 Apple Samantha (美音)';
          else if (v.name.includes('Daniel')) label = '🇬🇧 Apple Daniel (英倫)';
          else if (v.lang === 'en-US') label = `🇺🇸 ${v.name}`;
          else if (v.lang === 'en-GB') label = `🇬🇧 ${v.name}`;

          opt.textContent = label;
          if (savedVoice && savedVoice === v.name) {
            opt.selected = true;
          }
          voiceSelect.appendChild(opt);
        });
      }
    }

    if ('speechSynthesis' in window) {
      populateVoices();
      window.speechSynthesis.onvoiceschanged = populateVoices;
    }

    if (voiceSelect) {
      voiceSelect.addEventListener('change', (e) => {
        try {
          localStorage.setItem('daily_english_voice', e.target.value);
        } catch (err) {}
      });
    }

    function clearCardHighlights() {
      document.querySelectorAll('.sentence-card, .word-card').forEach(c => {
        c.classList.remove('card-active-playing');
      });
    }

    function stopPlayback() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      if (autoPlayTimer) {
        clearTimeout(autoPlayTimer);
        autoPlayTimer = null;
      }
      isAutoPlaying = false;
      clearCardHighlights();
      if (playingStatusBadge) playingStatusBadge.textContent = '準備就緒';
      if (nowPlayingDisplay) nowPlayingDisplay.classList.add('hidden');
    }

    if (stopAllBtn) stopAllBtn.addEventListener('click', stopPlayback);

    function getSelectedVoice() {
      if (!availableVoices.length) return null;
      const chosenName = voiceSelect ? voiceSelect.value : 'auto';
      if (chosenName !== 'auto') {
        const found = availableVoices.find(v => v.name === chosenName);
        if (found) return found;
      }
      return availableVoices.find(v => 
        v.name.includes('Natural') || 
        v.name.includes('Google US') || 
        v.name.includes('Google') || 
        v.name.includes('Samantha') || 
        v.name.includes('Jenny')
      ) || availableVoices[0] || null;
    }

    function speakText(text, cardElement, onEndCallback) {
      if (!('speechSynthesis' in window)) return;
      try { window.speechSynthesis.resume(); } catch (e) {}
      window.speechSynthesis.cancel();
      clearCardHighlights();

      if (cardElement) {
        cardElement.classList.add('card-active-playing');
        cardElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = parseFloat(speedSelect ? speedSelect.value : 1.0) || 1.0;
      utterance.pitch = 1.0;

      const activeVoice = getSelectedVoice();
      if (activeVoice) {
        utterance.voice = activeVoice;
        utterance.lang = activeVoice.lang;
      }

      if (playingStatusBadge) playingStatusBadge.textContent = '正在朗讀...';
      if (nowPlayingDisplay) nowPlayingDisplay.classList.remove('hidden');
      if (nowPlayingText) nowPlayingText.textContent = text;

      utterance.onend = () => {
        if (!isAutoPlaying) {
          clearCardHighlights();
          if (playingStatusBadge) playingStatusBadge.textContent = '朗讀完畢';
          if (nowPlayingDisplay) nowPlayingDisplay.classList.add('hidden');
        }
        if (onEndCallback) onEndCallback();
      };

      utterance.onerror = () => {
        clearCardHighlights();
        if (playingStatusBadge) playingStatusBadge.textContent = '朗讀停止';
        if (nowPlayingDisplay) nowPlayingDisplay.classList.add('hidden');
        isAutoPlaying = false;
      };

      window.speechSynthesis.speak(utterance);
    }

    function speakTextCustomRate(text, cardElement, customRate) {
      if (!('speechSynthesis' in window)) return;
      try { window.speechSynthesis.resume(); } catch (e) {}
      window.speechSynthesis.cancel();
      clearCardHighlights();

      if (cardElement) {
        cardElement.classList.add('card-active-playing');
        cardElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = customRate || 0.75;
      utterance.pitch = 1.0;

      const activeVoice = getSelectedVoice();
      if (activeVoice) {
        utterance.voice = activeVoice;
        utterance.lang = activeVoice.lang;
      }

      if (playingStatusBadge) playingStatusBadge.textContent = '🐢 0.75x 慢速慢聽中...';
      if (nowPlayingDisplay) nowPlayingDisplay.classList.remove('hidden');
      if (nowPlayingText) nowPlayingText.textContent = text;

      utterance.onend = () => {
        clearCardHighlights();
        if (playingStatusBadge) playingStatusBadge.textContent = '朗讀完畢';
        if (nowPlayingDisplay) nowPlayingDisplay.classList.add('hidden');
      };
      window.speechSynthesis.speak(utterance);
    }

    // -------------------------------------------------------------
    // 4. Starred Management & Quick Action Handlers
    // -------------------------------------------------------------
    let starredItems = new Set();
    try {
      const savedStars = JSON.parse(localStorage.getItem('daily_english_stars') || '[]');
      starredItems = new Set(savedStars);
    } catch (e) {}

    function updateStarIcons() {
      document.querySelectorAll('.star-btn').forEach(btn => {
        const id = btn.getAttribute('data-id');
        const isStarred = starredItems.has(id);
        const svg = btn.querySelector('svg');
        if (isStarred) {
          svg.setAttribute('class', 'w-4 h-4 fill-amber-400 text-amber-500');
          btn.classList.add('text-amber-500');
          btn.title = '取消收藏';
        } else {
          svg.setAttribute('class', 'w-4 h-4 fill-none stroke-current');
          btn.classList.remove('text-amber-500');
          btn.title = '加入收藏';
        }
      });
    }

    function bindStarButtons() {
      document.querySelectorAll('.star-btn').forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute('data-id');
          if (starredItems.has(id)) {
            starredItems.delete(id);
            showToast('已自收藏清單中移除', false);
          } else {
            starredItems.add(id);
            showToast('⭐ 已加入個人收藏清單！', true);
          }
          try {
            localStorage.setItem('daily_english_stars', JSON.stringify([...starredItems]));
          } catch (e) {}
          updateStarIcons();
        };
      });
      updateStarIcons();
    }

    function bindSpeakButtons() {
      document.querySelectorAll('.speak-btn').forEach(btn => {
        btn.onclick = () => {
          stopPlayback();
          const text = btn.getAttribute('data-text');
          const card = btn.closest('.sentence-card') || btn.closest('.word-card');
          speakText(text, card);
        };
      });
    }

    function bindSlowSpeakButtons() {
      document.querySelectorAll('.slow-speak-btn').forEach(btn => {
        btn.onclick = () => {
          stopPlayback();
          const text = btn.getAttribute('data-text');
          const card = btn.closest('.sentence-card') || btn.closest('.word-card');
          speakTextCustomRate(text, card, 0.75);
        };
      });
    }

    function bindCopyButtons() {
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.onclick = () => {
          const text = btn.getAttribute('data-copy');
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text);
            } else {
              const ta = document.createElement('textarea');
              ta.value = text;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand('copy');
              document.body.removeChild(ta);
            }
            showToast('已複製到剪貼簿！', true);
          } catch (e) {
            showToast('複製失敗', false);
          }
        };
      });
    }

    // -------------------------------------------------------------
    // 5. Card Rendering Logic
    // -------------------------------------------------------------
    function formatWordSentence(word, sentence) {
      if (!word || !sentence) return sentence;
      try {
        const regex = new RegExp(`\\b(${word}[a-z]*)\\b`, 'gi');
        return sentence.replace(regex, '<span class="text-emerald-800 bg-emerald-100/90 px-1.5 py-0.5 rounded-lg border border-emerald-300 font-extrabold">$1</span>');
      } catch (e) {
        return sentence;
      }
    }

    const sentencesSection = document.getElementById('sentencesSection');
    const wordsSection = document.getElementById('wordsSection');

    function renderSentences(sentences) {
      if (!sentencesSection) return;
      sentencesSection.innerHTML = '';
      sentences.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'sentence-card bg-white rounded-2xl border border-slate-200/90 p-5 sm:p-6 shadow-sm hover:shadow-md transition-all duration-200 relative group';
        div.id = `sentence-card-${index + 1}`;
        div.setAttribute('data-category', item.category || 'workplace');

        div.innerHTML = `
          <div class="flex items-start justify-between gap-4">
            <div class="flex-1 space-y-2">
              <div class="flex flex-wrap items-center gap-2">
                <span class="w-6 h-6 rounded-xl bg-blue-50 text-blue-700 text-xs font-black flex items-center justify-center border border-blue-100">${index + 1}</span>
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-indigo-50 text-indigo-700 border border-indigo-200/70">🏷️ ${item.scenario || '實用情境'}</span>
                <span class="text-xs font-bold text-slate-400 font-mono tracking-tight">${item.pattern}</span>
              </div>
              <p class="font-extrabold text-slate-900 tracking-tight sentence-text select-text">${item.highlightHtml || item.sentence}</p>
            </div>
            
            <div class="flex items-center gap-1.5 shrink-0">
              <button class="star-btn p-2 rounded-xl text-slate-300 hover:text-amber-500 hover:bg-amber-50 transition-colors" data-id="sent-${item.id}" title="加入收藏">
                <svg class="w-4 h-4 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
              </button>
              <button class="copy-btn p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors" data-copy="${item.sentence}" title="複製句子">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
              </button>
              <button class="slow-speak-btn bg-slate-100 hover:bg-slate-200 text-slate-700 p-2 rounded-xl border border-slate-200 transition-all text-xs font-bold shadow-xs active:scale-95" data-text="${item.sentence}" title="0.75x 慢速精細朗讀">
                🐢
              </button>
              <button class="speak-btn bg-blue-50 hover:bg-blue-600 text-blue-700 hover:text-white px-3 py-2 rounded-xl border border-blue-200 transition-all flex items-center gap-1.5 text-xs font-bold shadow-xs active:scale-95" data-text="${item.sentence}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
                <span>朗讀</span>
              </button>
            </div>
          </div>
          
          <div class="explanation-box mt-4 pt-3.5 border-t border-slate-100 ${explanationsVisible ? '' : 'hidden'}">
            <div class="bg-slate-50/90 rounded-2xl p-4 border border-slate-200/70 space-y-2.5">
              <div class="flex items-baseline gap-2.5">
                <span class="px-2 py-0.5 rounded-md bg-blue-100 text-blue-800 text-xs font-bold shrink-0">中文釋義</span>
                <p class="text-slate-900 font-bold chinese-main-meaning tracking-wide">${item.explanation}</p>
              </div>
              <p class="text-slate-700 chinese-detail-text leading-relaxed font-normal">${item.detail}</p>
              <div class="flex items-center gap-2 pt-1 border-t border-slate-200/50">
                <span class="text-amber-600 text-sm">💡</span>
                <span class="text-blue-800 font-semibold chinese-detail-text">練習提示：${item.tip}</span>
              </div>
            </div>
          </div>
        `;
        sentencesSection.appendChild(div);
      });

      bindSpeakButtons();
      bindCopyButtons();
      bindStarButtons();
      bindSlowSpeakButtons();
    }

    function renderWords(words) {
      if (!wordsSection) return;
      wordsSection.innerHTML = '';
      words.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'word-card bg-white rounded-2xl border border-slate-200/90 p-5 sm:p-6 shadow-sm hover:shadow-md transition-all duration-200 relative group';
        div.id = `word-card-${index + 1}`;

        div.innerHTML = `
          <div class="flex items-start justify-between gap-4">
            <div class="flex-1 space-y-2">
              <div class="flex flex-wrap items-baseline gap-2.5">
                <span class="w-6 h-6 rounded-xl bg-emerald-50 text-emerald-800 text-xs font-black flex items-center justify-center border border-emerald-100">${index + 1}</span>
                <h3 class="font-extrabold text-slate-900 tracking-tight word-title">${item.word}</h3>
                <span class="text-xs text-slate-500 font-mono-ipa px-1.5 py-0.5 rounded bg-slate-100">${item.ipa}</span>
                <span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-700">${item.pos}</span>
                <span class="text-base sm:text-lg font-extrabold text-emerald-700 ml-1.5">${item.meaning}</span>
              </div>
              <p class="font-semibold text-slate-800 word-sentence leading-relaxed pl-8">${formatWordSentence(item.word, item.sentence)}</p>
            </div>

            <div class="flex items-center gap-1.5 shrink-0">
              <button class="star-btn p-2 rounded-xl text-slate-300 hover:text-amber-500 hover:bg-amber-50 transition-colors" data-id="word-${item.id}" title="加入收藏">
                <svg class="w-4 h-4 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
              </button>
              <button class="copy-btn p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors" data-copy="${item.word} - ${item.sentence}" title="複製單字與例句">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
              </button>
              <button class="slow-speak-btn bg-slate-100 hover:bg-slate-200 text-slate-700 p-2 rounded-xl border border-slate-200 transition-all text-xs font-bold shadow-xs active:scale-95" data-text="${item.word}. ${item.sentence}" title="0.75x 慢速精細朗讀">
                🐢
              </button>
              <button class="speak-btn bg-emerald-50 hover:bg-emerald-600 text-emerald-700 hover:text-white px-3 py-2 rounded-xl border border-emerald-200 transition-all flex items-center gap-1.5 text-xs font-bold shadow-xs active:scale-95" data-text="${item.word}. ${item.sentence}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
                <span>朗讀</span>
              </button>
            </div>
          </div>
          
          <div class="explanation-box mt-4 pt-3.5 border-t border-slate-100 ${explanationsVisible ? '' : 'hidden'}">
            <div class="bg-emerald-50/60 rounded-2xl p-4 border border-emerald-200/60 space-y-2 text-slate-700 chinese-detail-text">
              <p><strong class="text-slate-900 font-bold">常見搭配：</strong><span class="font-medium text-slate-800">${item.collocation}</span></p>
              <p><strong class="text-slate-900 font-bold">例句翻譯：</strong><span class="font-medium text-slate-800">${item.translation}</span></p>
            </div>
          </div>
        `;
        wordsSection.appendChild(div);
      });

      bindSpeakButtons();
      bindCopyButtons();
      bindStarButtons();
      bindSlowSpeakButtons();
    }

    function renderLesson(lesson) {
      currentLesson = lesson;
      renderSentences(lesson.sentences || []);
      renderWords(lesson.words || []);
    }

    // Initial Execution
    renderLesson(defaultTodayLesson);

    // -------------------------------------------------------------
    // 6. Scenario Filter & Star Filter
    // -------------------------------------------------------------
    document.querySelectorAll('.scenario-filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.scenario-filter-btn').forEach(b => {
          b.className = 'scenario-filter-btn px-3 py-1.5 rounded-xl font-semibold bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 transition-all shrink-0';
        });
        btn.className = 'scenario-filter-btn px-3 py-1.5 rounded-xl font-bold bg-blue-600 text-white shadow-sm transition-all shrink-0';

        const filter = btn.getAttribute('data-scenario');
        const cards = sentencesSection ? sentencesSection.querySelectorAll('.sentence-card') : [];

        cards.forEach((card) => {
          const cat = card.getAttribute('data-category');
          if (filter === 'all') {
            card.classList.remove('hidden');
          } else {
            card.classList.toggle('hidden', cat !== filter);
          }
        });
      });
    });

    const showStarredBtn = document.getElementById('showStarredBtn');
    let showingOnlyStarred = false;

    if (showStarredBtn) {
      showStarredBtn.addEventListener('click', () => {
        showingOnlyStarred = !showingOnlyStarred;
        showStarredBtn.className = showingOnlyStarred
          ? 'px-3 py-1.5 rounded-xl font-bold bg-amber-500 text-white shadow-sm transition-all shrink-0 flex items-center gap-1'
          : 'px-3 py-1.5 rounded-xl font-semibold bg-amber-50 border border-amber-200 text-amber-800 hover:bg-amber-100 transition-all shrink-0 flex items-center gap-1';

        const cards = sentencesSection ? sentencesSection.querySelectorAll('.sentence-card') : [];
        cards.forEach(card => {
          const starBtn = card.querySelector('.star-btn');
          const id = starBtn ? starBtn.getAttribute('data-id') : '';
          if (showingOnlyStarred) {
            card.classList.toggle('hidden', !starredItems.has(id));
          } else {
            card.classList.remove('hidden');
          }
        });
      });
    }

    // -------------------------------------------------------------
    // 7. Tabs & Explanation Toggle
    // -------------------------------------------------------------
    const tabSentencesBtn = document.getElementById('tabSentencesBtn');
    const tabWordsBtn = document.getElementById('tabWordsBtn');
    const sentencesWrapper = document.getElementById('sentencesWrapper');

    if (tabSentencesBtn && tabWordsBtn) {
      tabSentencesBtn.addEventListener('click', () => {
        if (sentencesWrapper) sentencesWrapper.classList.remove('hidden');
        if (wordsSection) wordsSection.classList.add('hidden');
        tabSentencesBtn.className = 'px-5 py-2 rounded-xl font-extrabold text-xs sm:text-sm bg-white text-blue-700 shadow-sm transition-all flex items-center gap-2';
        tabWordsBtn.className = 'px-5 py-2 rounded-xl font-bold text-xs sm:text-sm text-slate-600 hover:text-slate-900 transition-all flex items-center gap-2';
      });

      tabWordsBtn.addEventListener('click', () => {
        if (wordsSection) wordsSection.classList.remove('hidden');
        if (sentencesWrapper) sentencesWrapper.classList.add('hidden');
        tabWordsBtn.className = 'px-5 py-2 rounded-xl font-extrabold text-xs sm:text-sm bg-white text-blue-700 shadow-sm transition-all flex items-center gap-2';
        tabSentencesBtn.className = 'px-5 py-2 rounded-xl font-bold text-xs sm:text-sm text-slate-600 hover:text-slate-900 transition-all flex items-center gap-2';
      });
    }

    const toggleExplanationBtn = document.getElementById('toggleExplanationBtn');
    const toggleExpText = document.getElementById('toggleExpText');

            box.classList.remove('hidden');
          } else {

          }
        });

    // 8. Font Size Scaling
    // -------------------------------------------------------------
    const fontSizeSelect = document.getElementById('fontSizeSelect');
    function applyFontSize(size) {
      document.body.classList.remove('font-size-large', 'font-size-xlarge');
      if (size === 'large') {
        document.body.classList.add('font-size-large');
      } else if (size === 'xlarge') {
        document.body.classList.add('font-size-xlarge');
      }
      try {
        localStorage.setItem('daily_english_fontsize', size);
      } catch (e) {}
    }

      fontSizeSelect.addEventListener('change', (e) => {
        applyFontSize(e.target.value);

        if (savedSize) {

          applyFontSize(savedSize);

    // -------------------------------------------------------------
    // 9. Calendar Picker
    // -------------------------------------------------------------
    const openCalendarBtn = document.getElementById('openCalendarBtn');
    const calendarModal = document.getElementById('calendarModal');
    const closeCalendarModalBtn = document.getElementById('closeCalendarModalBtn');
    const calMonthTitle = document.getElementById('calMonthTitle');
    const calDaysGrid = document.getElementById('calDaysGrid');
    const calPrevMonthBtn = document.getElementById('calPrevMonthBtn');
    const calNextMonthBtn = document.getElementById('calNextMonthBtn');
    const calJumpTodayBtn = document.getElementById('calJumpTodayBtn');
    const calendarCurrentDateLabel = document.getElementById('calendarCurrentDateLabel');

    let calYear = 2026;
    let calMonth = 10;
    let existingLessonDates = new Set(["2026-11-08"]);

    if (openCalendarBtn) {
      openCalendarBtn.addEventListener('click', () => {
        renderCalendarDays();
        calendarModal.classList.remove('hidden');
      });
    }

    if (closeCalendarModalBtn) {
      closeCalendarModalBtn.addEventListener('click', () => {
        calendarModal.classList.add('hidden');
      });
    }

    if (calPrevMonthBtn) {
      calPrevMonthBtn.addEventListener('click', () => {
        calMonth--;
        if (calMonth < 0) {
          calMonth = 11;
          calYear--;
        }
        renderCalendarDays();
      });
    }

    if (calNextMonthBtn) {
      calNextMonthBtn.addEventListener('click', () => {
        calMonth++;
        if (calMonth > 11) {
          calMonth = 0;
          calYear++;
        }
        renderCalendarDays();
      });
    }

    if (calJumpTodayBtn) {
      calJumpTodayBtn.addEventListener('click', () => {
        calYear = 2026;
        calMonth = 10;
        renderCalendarDays();
        selectLessonByDate("2026-11-08");
        calendarModal.classList.add('hidden');
      });
    }

    function renderCalendarDays() {
      if (!calMonthTitle || !calDaysGrid) return;
      calMonthTitle.textContent = `${calYear} 年 ${calMonth + 1} 月`;
      calDaysGrid.innerHTML = '';

      const firstDay = new Date(calYear, calMonth, 1).getDay();
      const totalDays = new Date(calYear, calMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'p-2 text-transparent';
        calDaysGrid.appendChild(emptyCell);
      }

      for (let day = 1; day <= totalDays; day++) {
        const monthStr = String(calMonth + 1).padStart(2, '0');
        const dayStr = String(day).padStart(2, '0');
        const dateKey = `${calYear}-${monthStr}-${dayStr}`;

        const dayBtn = document.createElement('button');
        const hasLesson = existingLessonDates.has(dateKey);
        const isCurrentView = (currentLesson && currentLesson.date === dateKey);

        let btnClass = 'p-2 rounded-2xl flex flex-col items-center justify-center transition-all relative font-bold ';
        if (isCurrentView) {
          btnClass += 'bg-blue-600 text-white shadow-md shadow-blue-500/25';
        } else if (hasLesson) {
          btnClass += 'bg-blue-50 text-blue-900 hover:bg-blue-100';
        } else {
          btnClass += 'text-slate-400 hover:bg-slate-50';
        }

        dayBtn.className = btnClass;
        dayBtn.innerHTML = `<span>${day}</span>`;

        if (hasLesson && !isCurrentView) {
          dayBtn.innerHTML += `<span class="w-1.5 h-1.5 rounded-full bg-blue-600 mt-0.5"></span>`;
        }

        dayBtn.addEventListener('click', () => {
          selectLessonByDate(dateKey);
          calendarModal.classList.add('hidden');
        });

        calDaysGrid.appendChild(dayBtn);
      }
    }

    const lessonDateSelect = document.getElementById('lessonDateSelect');
    async function selectLessonByDate(targetDate) {
      if (calendarCurrentDateLabel) calendarCurrentDateLabel.textContent = `📅 ${targetDate}`;
      if (lessonDateSelect) lessonDateSelect.value = targetDate;

      if (targetDate === "2026-11-08" && !db) {
        renderLesson(defaultTodayLesson);
        return;
      }

      if (db) {
        try {
          const doc = await db.collection('daily_lessons').doc(targetDate).get();
          if (doc.exists) {
            renderLesson(doc.data());
            showToast(`已載入 ${targetDate} 學習教材`, true);
          } else {
            showToast(`${targetDate} 尚無教材，管理員可使用「批次補登」新增`, false);
          }
        } catch (err) {
          console.error(err);

      }

    // -------------------------------------------------------------
    // 10. Shadowing Continuous Playback
    // -------------------------------------------------------------
    function startAutoPlayback(items) {
      stopPlayback();
      isAutoPlaying = true;
      autoPlayIndex = 0;
      autoPlayItems = items;

      function playNext() {
        if (!isAutoPlaying || autoPlayIndex >= autoPlayItems.length) {
          stopPlayback();
          if (playingStatusBadge) playingStatusBadge.textContent = '全部朗讀完畢！';
          showToast('🎉 今日練習已全部跟讀完成！', true);
          return;
        }

        const currentItem = autoPlayItems[autoPlayIndex];
        const currentNum = autoPlayIndex + 1;
        const totalNum = autoPlayItems.length;
        
        if (playingStatusBadge) playingStatusBadge.textContent = `連續跟讀中 (${currentNum}/${totalNum})`;
        
        const playingItemProgressTag = document.getElementById('playingItemProgressTag');
        const autoPlayProgressBar = document.getElementById('autoPlayProgressBar');
        const shadowingCountdownBadge = document.getElementById('shadowingCountdownBadge');

        if (playingItemProgressTag) playingItemProgressTag.textContent = `${currentNum} / ${totalNum}`;
        if (autoPlayProgressBar) autoPlayProgressBar.style.width = `${(currentNum / totalNum) * 100}%`;
        if (shadowingCountdownBadge) shadowingCountdownBadge.textContent = '🔊 正在播放';

        speakText(currentItem.text, currentItem.card, () => {
          if (!isAutoPlaying) return;
          if (shadowingCountdownBadge) shadowingCountdownBadge.textContent = '🗣️ 請大聲跟讀...';
          autoPlayIndex++;
          autoPlayTimer = setTimeout(playNext, 1800);
        });
      }

      playNext();
    }

    // -------------------------------------------------------------
    // 12. Firestore Remote Loader & Admin Actions
    // -------------------------------------------------------------
    async function loadLessonsListFromFirestore() {
      if (!db) return;
      try {
        const snapshot = await db.collection('daily_lessons').orderBy('date', 'desc').get();
        if (!snapshot.empty) {
          if (lessonDateSelect) lessonDateSelect.innerHTML = '';
          existingLessonDates.clear();
          snapshot.forEach(doc => {
            const data = doc.data();
            const dKey = data.date || doc.id;
            existingLessonDates.add(dKey);
            if (lessonDateSelect) {
              const opt = document.createElement('option');
              opt.value = dKey;
              opt.textContent = `${dKey} (${data.title || '英文練習'})`;
              lessonDateSelect.appendChild(opt);
            }
          });
          const firstData = snapshot.docs[0].data();
          renderLesson(firstData);
          if (calendarCurrentDateLabel) calendarCurrentDateLabel.textContent = `📅 ${firstData.date || '今日教材'}`;
        }
      } catch (err) {
        console.log('Firestore read notice:', err.message);
      }
    }

        if (!db) {

          return;
        }
        if (!currentUser || currentUser.email !== ADMIN_EMAIL) {
          showToast(`權限不足：請先登入管理員帳號 (${ADMIN_EMAIL})`, false);
          return;
        }

        if (seedBtnLabel) seedBtnLabel.textContent = '寫入中...';
        try {
          await db.collection('daily_lessons').doc(defaultTodayLesson.date).set(defaultTodayLesson);
          if (seedBtnLabel) seedBtnLabel.textContent = '已成功儲存至 Firestore！';
          showToast(`今日教材 (${defaultTodayLesson.date}) 已成功寫入雲端！`, true);
          setTimeout(() => {
            if (seedBtnLabel) seedBtnLabel.textContent = '同步今日教材至雲端';
          }, 3000);
          loadLessonsListFromFirestore();
        } catch (err) {
          console.error('Save to Firestore error:', err);

      saveImportBtn.addEventListener('click', async () => {
        if (!currentUser || currentUser.email !== ADMIN_EMAIL) {
          if (modalNoticeMsg) {
            modalNoticeMsg.className = 'text-xs p-3 rounded-xl bg-amber-50 text-amber-900 border border-amber-200 block font-semibold';
            modalNoticeMsg.textContent = `請先登入管理員帳號 (${ADMIN_EMAIL}) 才能上傳教材。`;
          }
          return;
        }

        let parsed = null;
        try {
          parsed = JSON.parse(importJsonInput ? importJsonInput.value : "{}");
        } catch (e) {
          if (modalNoticeMsg) {
            modalNoticeMsg.className = 'text-xs p-3 rounded-xl bg-red-50 text-red-900 border border-red-200 block font-semibold';
            modalNoticeMsg.textContent = 'JSON 格式解析錯誤，請檢查語法。';
          }
          return;
        }

        const lessonsToUpload = Array.isArray(parsed) ? parsed : [parsed];

        try {
          for (const item of lessonsToUpload) {
            const targetDate = item.date || (importDateInput ? importDateInput.value : "");
            const targetTitle = item.title || (importTitleInput ? importTitleInput.value : "") || "每日英文練習";
            const docData = {
              date: targetDate,
              title: targetTitle,
              sentences: item.sentences || [],
              words: item.words || []
            };
            if (db && targetDate) {
              await db.collection('daily_lessons').doc(targetDate).set(docData);
            }
          }

          closeImportModal();
          showToast(`已成功補登／上傳 ${lessonsToUpload.length} 天教材至 Firebase！`, true);
          loadLessonsListFromFirestore();
        } catch (err) {
          if (modalNoticeMsg) {
            modalNoticeMsg.className = 'text-xs p-3 rounded-xl bg-red-50 text-red-900 border border-red-200 block font-semibold';
            modalNoticeMsg.textContent = `儲存失敗：${err.message}`;
          }
        }
      });
    }

    // Google Auth Login
    async function handleGoogleLogin() {
      if (!auth) {
        showToast('Firebase 認證模組尚未就緒，請稍候重試。', false);
        return;
      }
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await auth.signInWithPopup(provider);
      } catch (err) {
        try {
          await auth.signInWithRedirect(provider);
        } catch (redirErr) {
          showToast(`登入失敗：${redirErr.message}`, false);
        }
      }
    }

    if (loginBtn) loginBtn.addEventListener('click', handleGoogleLogin);
    if (mobileLoginBtn) mobileLoginBtn.addEventListener('click', handleGoogleLogin);

    if (logoutBtn) {
      logoutBtn.addEventListener('click', async () => {
        if (auth) {
          await auth.signOut();
          showToast('已安全登出。', true);
        }
      });
    }

    // Initialize Firebase Auth listener
    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        auth = firebase.auth();
        if (firestoreStatus) {
          firestoreStatus.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500"></span>已連線至 Firebase';
          firestoreStatus.className = 'inline-flex items-center gap-1.5 text-xs text-emerald-700 font-bold';
        }

        auth.onAuthStateChanged(user => {
          currentUser = user;
          if (user) {
            if (loginBtn) loginBtn.classList.add('hidden');
            if (userProfileArea) userProfileArea.classList.remove('hidden');
            if (userEmailSpan) userEmailSpan.textContent = user.email || '已登入';

            if (user.email === ADMIN_EMAIL) {
              if (userProfileArea) userProfileArea.className = 'flex items-center gap-2 bg-emerald-50 border border-emerald-300 px-3 py-1.5 rounded-xl text-xs text-emerald-800 shadow-sm font-bold';
              showToast(`管理員 ${user.email} 已認證，具備最高雲端寫入權限！`, true);
            } else {
              if (userProfileArea) userProfileArea.className = 'flex items-center gap-2 bg-slate-100 border border-slate-300 px-3 py-1.5 rounded-xl text-xs text-slate-700 shadow-sm font-semibold';
              showToast(`以一般訪客身分登入 (${user.email})，僅提供閱讀與練習。`, false);
            }
          } else {
            if (loginBtn) loginBtn.classList.remove('hidden');
            if (userProfileArea) userProfileArea.classList.add('hidden');
          }
        });
      }
    } catch (err) {
      console.warn('Firebase init warning:', err);
      if (firestoreStatus) {
        firestoreStatus.innerHTML = '<span class="w-2 h-2 rounded-full bg-slate-400"></span>離線本機資料庫';
        firestoreStatus.className = 'inline-flex items-center gap-1.5 text-xs text-slate-500 font-medium';
      }
    }

    // Keyboard Shortcuts: Esc = Stop All
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.code === 'Escape') {
        stopPlayback();
      }
    });

    // Start background load
    loadLessonsListFromFirestore();
  </script>
</body>
</html>
